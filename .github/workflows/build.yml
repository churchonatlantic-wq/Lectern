name: Build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the installers to this release (for example v1.1.1). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build Windows
        if: runner.os == 'Windows'
        run: npm run dist:win -- --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          # No certificate saved: drop the empty signing variables, or electron-builder treats "" as a path.
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          npm run dist:mac -- --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          USE_HARD_LINKS: 'false'
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: lectern-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
      # Attach the installers to a release: the tag typed when starting the run, or the pushed tag.
      # The release is created if it does not exist yet; files already on it are replaced.
      - name: Attach to release
        if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Lectern ${TAG#v}" --notes "Installers for Windows and Mac." || true
          shopt -s nullglob
          files=()
          for f in dist/*.exe dist/*.zip dist/*.dmg; do case "$(basename "$f")" in __*) ;; *) files+=("$f") ;; esac; done
          echo "Attaching: ${files[*]}"
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
